<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betty</title>
<meta name="description" content="SportyBet booking codes from measured rules, graded leg by leg, live codes at the half-time whistle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#171411; --s1:#201c17; --s2:#29241d; --s3:#332d24; --line:#3a3329; --line2:#4b4339;
  --tx:#f4ece0; --tx2:#b5a895; --tx3:#8a7e6d;
  --ac:#e08b4f; --ac-ink:#2b1a0c; --ac-soft:rgba(224,139,79,.13); --ac-tx:#f0a367;
  --won:#63ab58; --won-soft:rgba(99,171,88,.14);
  --lost:#dd6350; --lost-soft:rgba(221,99,80,.14);
  --livec:#dda032; --live-soft:rgba(221,160,50,.14);
  --pend:#8a7e6d; --pend-soft:rgba(138,126,109,.15);
  --void:#6f9ecd; --void-soft:rgba(111,158,205,.14);
  --terra:#f0a367; --sage:#a8c07a; --sage-soft:rgba(168,192,122,.13);
  --code-bg:#0f0c09; --code-tx:#f4ece0;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Figtree',system-ui,-apple-system,sans-serif;
  --serif:'Caprasimo',Georgia,serif;
}
[data-t="light"]{
  --bg:#f5ead8; --s1:#fdf4e9; --s2:#eee7db; --s3:#e3d9c8; --line:#dcd3c4; --line2:#c0b6a5;
  --tx:#201e1d; --tx2:#645c50; --tx3:#82796a;
  --ac:#c67139; --ac-ink:#fff6ee; --ac-soft:rgba(198,113,57,.11); --ac-tx:#8c491a;
  --won:#3f7a33; --won-soft:rgba(63,122,51,.12);
  --lost:#b2402f; --lost-soft:rgba(178,64,47,.11);
  --livec:#8c6415; --live-soft:rgba(140,100,21,.13);
  --pend:#82796a; --pend-soft:rgba(130,121,106,.13);
  --void:#3a6a99; --void-soft:rgba(58,106,153,.12);
  --terra:#8c491a; --sage:#4f5d38; --sage-soft:rgba(122,138,94,.12);
  --code-bg:#201e1d; --code-tx:#f5ead8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#171411}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--ac-tx);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input{font-family:inherit}
::selection{background:var(--ac-soft)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.35}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{min-height:100vh;background:var(--bg);color:var(--tx)}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--s1);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;padding:0}
.brand .mark{display:none}
.brand .word{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;color:var(--tx)}
.brand .dot{width:7px;height:7px;border-radius:999px;background:var(--ac);display:block;margin-left:7px;align-self:flex-end;margin-bottom:3px}
nav.top{display:flex;gap:2px;margin-left:10px;flex:1}
nav.top button,nav.top a{padding:8px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--tx2)}
nav.top button.on{color:var(--ac-tx)}
nav.top button:hover{color:var(--tx);text-decoration:none}
.theme{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);font-size:12.5px;font-weight:600;font-family:var(--mono)}
.more{position:relative}
.menu{position:absolute;right:0;top:40px;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none;z-index:50}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--tx2)}
.menu button:hover{background:var(--s2);color:var(--tx)}

main{max-width:1100px;margin:0 auto;padding:22px 16px 48px}
.col{max-width:780px;margin:0 auto}
h1.page{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.8vw,42px);letter-spacing:-.01em;margin:0 0 6px;line-height:1.1}
h1.page em{font-style:normal;color:var(--ac-tx)}
.lead{margin:0 0 20px;color:var(--tx2);font-size:15px;text-wrap:pretty}
.center{text-align:center}
.livepill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:var(--ac-soft);color:var(--ac-tx);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.livepill i{width:6px;height:6px;border-radius:999px;background:var(--ac);animation:bpulse 2s infinite;display:block}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pills.center{justify-content:center}
.pills button{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line2);color:var(--tx2);min-height:38px;background:var(--s1)}
.pills button.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.pills button.on2{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.kicker{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--tx3);margin-bottom:10px}
.muted{color:var(--tx3);font-size:12.5px}
.err{border:1px solid var(--lost);background:var(--lost-soft);color:var(--lost);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.empty{border:1px dashed var(--line2);border-radius:18px;padding:40px 24px;text-align:center;background:var(--s1)}
.empty .t{font-family:var(--serif);font-weight:400;font-size:20px;margin-bottom:6px}
.empty .d{color:var(--tx2);font-size:14px}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;background:var(--s3);color:var(--tx2)}
.chip.won{background:var(--won-soft);color:var(--won)}
.chip.lost{background:var(--lost-soft);color:var(--lost)}
.chip.live{background:var(--live-soft);color:var(--livec)}
.chip.pending{background:var(--live-soft);color:var(--livec)}
.chip.void{background:var(--void-soft);color:var(--void)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;background:var(--s3);color:var(--tx2)}
.badge[data-p="Winners"],.badge[data-p="Draws"],.badge[data-p="Half-time draw"],.badge[data-p="Live"],.badge[data-p="Points sports"],.badge[data-p="Max odds"],.badge[data-p="All games"],.badge[data-p="Graded code"]{background:var(--ac-soft);color:var(--ac-tx)}
.badge[data-p="Live"]{background:var(--live-soft);color:var(--livec)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 6px;border-radius:8px;font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--pend-soft);color:var(--pend)}
.pill.W{background:var(--won-soft);color:var(--won)}
.pill.L{background:var(--lost-soft);color:var(--lost)}
.wdl{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--pend-soft);color:var(--pend)}
.wdl.W{background:var(--won-soft);color:var(--won)}
.wdl.L{background:var(--lost-soft);color:var(--lost)}
.num{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--s3);color:var(--tx3)}
.num.hot{background:var(--won-soft);color:var(--won)}
.copy{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:12px;background:var(--ac);color:var(--ac-ink);border:1px solid transparent;font-weight:800;font-size:14px;white-space:nowrap;min-height:48px}
.copy.on{background:var(--won-soft);color:var(--won);border-color:var(--won)}
.copy.big{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:12px;background:var(--ac);color:var(--ac-ink);font-weight:700;font-size:13.5px;text-decoration:none}
.btn:hover{text-decoration:none}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--tx)}
.btn.wide{width:100%;padding:12px;font-weight:800;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.track{width:46px;height:27px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);padding:2px;display:flex;justify-content:flex-start;align-items:center;flex:none}
.track.on{background:var(--ac);justify-content:flex-end}
.knob{width:21px;height:21px;border-radius:999px;background:var(--tx3);display:block}
.track.on .knob{background:var(--ac-ink)}
.ghost{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);font-size:13px;font-weight:600}

/* the code card (greenpicks pattern) */
.tip{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}
.tip.dead{border-color:var(--lost)}
.tip.won{border-color:var(--won)}
.tip .lab{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ac-tx);margin-bottom:6px}
.tip .lab .when{color:var(--tx3);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:12px;margin-left:auto;font-family:var(--mono)}
.tip h2{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:23px}
.tip .sub{color:var(--tx2);font-size:13.5px;margin-bottom:16px}
.box{background:var(--s2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.box .sum{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.box .sum .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:800;margin-bottom:3px}
.box .sum .v{font-size:20px;font-weight:800;color:var(--ac-tx)}
.box .sum .odds{font-family:var(--mono);font-size:22px;font-weight:700;text-align:right;margin-top:5px}
.box .sum .right{text-align:right}
.legs{max-height:300px;overflow:auto}
.legs.all{max-height:none}
.lg{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 16px;border-top:1px solid var(--line)}
.lg:first-child{border-top:none}
.lg .i{width:22px;height:22px;border-radius:999px;background:var(--s3);color:var(--tx2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.lg .m{font-weight:700;font-size:14px;line-height:1.3}
.lg .s{font-size:12.5px;color:var(--tx2);margin-top:2px}
.lg .s b{color:var(--ac-tx);font-weight:700}
.lg .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lg .sc{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--tx2)}
.res{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.res.won{background:var(--won-soft);color:var(--won)}
.res.lost{background:var(--lost-soft);color:var(--lost)}
.res.live{background:var(--live-soft);color:var(--livec)}
.res.pending{background:var(--s3);color:var(--tx3)}
.res.void{background:var(--void-soft);color:var(--void)}
.showall{width:100%;padding:9px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--tx2);background:var(--s2)}
.coderow{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.codebar{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 14px;border-radius:12px;background:var(--code-bg);color:var(--code-tx);border:1px solid var(--line2);font-family:var(--mono);font-weight:700;font-size:clamp(18px,4.6vw,22px);letter-spacing:.24em;min-height:48px}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.links a{font-weight:600}
.links .muted{margin-left:auto}
.older{margin:4px 0 16px;text-align:center}
.older button{font-size:12.5px;color:var(--tx2);border:1px solid var(--line2);border-radius:999px;padding:7px 13px}

/* the odds picker - the first control on the page */
.oddsbar{position:sticky;top:61px;z-index:30;background:var(--bg);padding:10px 0 12px;margin-bottom:8px}
.oddsbar .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--tx3);margin-bottom:8px;text-align:center}
.seg{display:flex;gap:4px;padding:4px;background:var(--s2);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg button{flex:none;padding:10px 16px;border-radius:999px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--tx2);min-height:42px;transition:transform 120ms cubic-bezier(.23,1,.32,1),background 160ms ease,color 160ms ease}
.seg button.on{background:var(--ac);color:var(--ac-ink)}
.seg button:active{transform:scale(.96)}
.seg button.none{opacity:.45}
.oddsnote{text-align:center;color:var(--tx2);font-size:13.5px;margin:10px 0 18px}
.rung{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:14px;animation:rise 240ms cubic-bezier(.23,1,.32,1) both}
.rung:nth-child(2){animation-delay:40ms}.rung:nth-child(3){animation-delay:80ms}.rung:nth-child(4){animation-delay:120ms}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rung{animation:none}}
.rung .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rung .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ac-tx)}
.rung h2{margin:2px 0 0;font-family:var(--serif);font-weight:400;font-size:22px}
.rung .odds{font-family:var(--mono);font-size:24px;font-weight:700;text-align:right}
.rung.dead{border-color:var(--lost)}
.rung.won{border-color:var(--won)}
.rung .odds small{font-size:12px;color:var(--tx3);font-family:var(--sans);font-weight:600;margin-left:6px}
.rung .legs{max-height:none}
.copy,.btn,.pills button,.ghost{transition:transform 120ms cubic-bezier(.23,1,.32,1),background 160ms ease,border-color 160ms ease}
.copy:active,.btn:active,.pills button:active,.ghost:active{transform:scale(.97)}
.daylink{text-align:center;margin:6px 0 16px;font-size:13px}
.daylink a{color:var(--tx2);font-weight:600;margin:0 8px}
.daylink a.on{color:var(--ac-tx)}

/* pick your odds */
.pick{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pick .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick .k i{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--tx3);font-size:12px}
.pick .chips{margin-bottom:0}
.pick .chips button{font-family:var(--mono);font-weight:700}
.pick .chips button.have{border-color:var(--ac);color:var(--ac-tx);background:var(--ac-soft)}
.pick .chips button.busy{opacity:.6}
.nest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.nest .t{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ac-tx);min-width:44px}
.nest .cb{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.18em;padding:8px 12px;border-radius:10px;background:var(--code-bg);color:var(--code-tx);border:1px solid var(--line2)}
.nest .m{font-size:12px;color:var(--tx2);flex:1;min-width:120px}
.nest .copy{min-height:40px;padding:9px 14px;font-size:13px}
.pick .msg{margin-top:8px;font-size:12.5px;color:var(--lost)}

/* grade box */
.gradebox{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.gradebox .t{font-weight:700;font-size:14px}
.gradebox .d{font-size:12.5px;color:var(--tx2)}
.gradebox input{flex:1;min-width:140px;max-width:220px;padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--tx);font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.stat .v{font-size:30px;font-weight:800;line-height:1;margin-bottom:6px}
.stat .v.g{color:var(--ac-tx)}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-weight:800}
.row{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto auto;gap:14px;align-items:center;margin-bottom:8px}
.row .cd{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cd a{color:var(--tx3)}
.row .m{font-weight:700;font-size:14px;line-height:1.25}
.row .selc{display:inline-flex;padding:3px 9px;border-radius:7px;border:1px solid var(--ac);color:var(--ac-tx);font-size:12px;font-weight:700;margin-bottom:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .note{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row .sc{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--tx2);padding:4px 8px;border-radius:7px;background:var(--s2)}
.more-rows{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line2);font-weight:700;color:var(--tx2);margin-top:6px}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .row .sel{grid-column:1 / -1}
}

/* slip detail (the numbers) */
.shead{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.kv{display:flex;gap:18px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv span{display:block}
.kv .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-family:var(--sans);font-weight:700;margin-bottom:2px}
.kv .v{font-size:20px;font-weight:700}
.leg{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--pend);border-radius:14px;overflow:hidden;margin-bottom:8px}
.leg.won{border-left-color:var(--won)}.leg.lost{border-left-color:var(--lost)}.leg.live{border-left-color:var(--livec)}.leg.void{border-left-color:var(--void)}
.leg > button{width:100%;text-align:left;padding:13px 14px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start}
.leg .ko{font-family:var(--mono);font-size:13px;color:var(--tx2);padding-top:2px}
.leg .comp{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:3px}
.leg .match{display:block;font-size:15px;font-weight:700;margin-bottom:4px}
.leg .sel{display:inline-block;font-size:13.5px;color:var(--ac-tx);font-weight:600}
.leg .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}

    if (!force && S.ladder && Date.now() - S.ladderAt < 45000 && S.ladder.day === (S.day === 'yesterday' ? 'y' : 't')) return Promise.resolve();
    S.ladderBusy = true;
    return get('/api/ladder?day=' + S.day).then(function (j) {
      j.products = (j.products || []).map(decorate); j.dayKey = S.day === 'yesterday' ? 'y' : 't';
      S.ladder = j; S.ladderAt = Date.now(); S.ladderBusy = false; S.err = null; if (S.tab === 'Today') render();
    }).catch(function (e) { S.ladderBusy = false; S.err = 'Could not load the codes: ' + e.message; render(); });
  }
  function loadBanner() { return get('/api/banner').then(function (j) { S.banner = j; }).catch(function () {}); }
  function loadLive() {
    return get('/api/livefeed').then(function (j) { j.codes = (j.codes || []).map(decorate); S.live = j; S.liveAt = Date.now(); if (S.tab === 'Live') render(); })
      .catch(function (e) { if (S.tab === 'Live') { S.err = 'Could not load the live feed: ' + e.message; render(); } });
  }
  function loadLegs() { return get('/api/legs').then(function (j) { S.legsData = j; if (S.tab === 'Record') render(); }).catch(function (e) { S.err = 'Could not load results: ' + e.message; render(); }); }
  function loadRules() { return get('/api/rules').then(function (j) { S.rules = j; if (S.tab === 'Rules') render(); }).catch(function (e) { S.err = 'Could not load the rules: ' + e.message; render(); }); }
  function loadConsole() {
    return fetch('/api/console', { cache: 'no-store', headers: { 'X-Ops-Key': S.key || '' } }).then(function (r) {
      if (r.status === 401) { S.locked = true; S.console = null; if (S.tab === 'Console') render(); return; }
      if (!r.ok) throw new Error('console ' + r.status);
      return r.json().then(function (j) { S.locked = false; S.console = j; S.consoleAt = Date.now(); if (S.tab === 'Console') render(); });
    }).catch(function (e) { S.err = 'Could not load the console: ' + e.message; render(); });
  }

  function decorate(c) {
    var n = { won: 0, lost: 0, live: 0, pending: 0, void: 0 };
    (c.legs || []).forEach(function (l) { n[l.state] = (n[l.state] || 0) + 1; });
    var total = (c.legs || []).length;
    c.n = n; c.total = total; c.dead = n.lost > 0;
    c.allWon = total > 0 && n.won + n.void === total && n.won > 0;
    c.stateKey = c.dead ? 'lost' : c.allWon ? 'won' : n.live > 0 ? 'live' : 'pending';
    c.stateTxt = c.dead ? 'Lost' : c.allWon ? 'Won' : n.live > 0 ? 'Live' : 'Pending';
    return c;
  }
  function allCodes() {
    var out = [];
    Object.keys(S.codes).forEach(function (d) { out = out.concat(S.codes[d]); });
    if (S.live) S.live.codes.forEach(function (c) { if (!out.some(function (x) { return x.code === c.code; })) out.push(c); });
    if (S.graded && S.graded.legs && S.graded.legs.length && !out.some(function (x) { return x.code === S.graded.code; })) out.push(S.graded);
    return out;
  }
  function findCode(code) { return allCodes().filter(function (c) { return c.code === code; })[0]; }

  // ---------- actions ----------
  function setHash(h) { if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) { location.hash = h; } } }
  function go(tab) { S.tab = tab; S.slip = null; S.err = null; closeMenu(); window.scrollTo(0, 0); setHash(tab === 'Today' ? '#' : '#' + tab.toLowerCase()); render(); ensure(); }
  function ensure() {
    if (S.tab === 'Today') { loadLadder(); loadCodes(); }
    if (S.tab === 'Live') loadLive();
    if (S.tab === 'Record') { if (!S.legsData) loadLegs(); }
    if (S.tab === 'Rules') { if (!S.rules) loadRules(); }
    if (S.tab === 'Console') loadConsole();
  }
  function openSlip(code) { S.slip = code; S.tab = 'Slip'; S.openLeg = null; window.scrollTo(0, 0); setHash('#slip/' + code); render(); }
  function route() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var m = /^slip\/(\w{5,8})(?:\/(\d+))?$/.exec(h);
    if (m) {
      var code = m[1], leg = m[2] != null ? +m[2] : null;
      if (findCode(code)) { openSlip(code); if (leg != null) { S.openLeg = leg; render(); } return; }
      gradeCode(code); return;
    }
    var mc = /^console(?:\/(\w+))?$/.exec(h);
    if (mc) { if (mc[1]) { var p = mc[1].charAt(0).toUpperCase() + mc[1].slice(1); if (CONSOLE_PANES.indexOf(p) >= 0) S.pane = p; } if (S.tab !== 'Console') go('Console'); return; }
    var tab = { live: 'Live', record: 'Record', results: 'Record', rules: 'Rules' }[h];
    if (tab && tab !== S.tab) go(tab);
  }
  function doCopy(code) {
    S.copied = code;
    try { navigator.clipboard.writeText(code); } catch (e) {}
    clearTimeout(doCopy.t); doCopy.t = setTimeout(function () { S.copied = null; render(); }, 1800);
    render();
  }
  function gradeCode(code) {
    code = (code || '').trim().toUpperCase();
    if (!code) return;
    S.gradeBusy = true; S.err = null; render();
    get('/api/gradecode?code=' + encodeURIComponent(code)).then(function (j) {
      S.gradeBusy = false;
      if (j.error && !(j.legs && j.legs.length)) { S.err = j.error; render(); return; }
      S.graded = decorate(j); openSlip(j.code);
    }).catch(function (e) { S.gradeBusy = false; S.err = 'Could not grade ' + code + ': ' + e.message; render(); });
  }
  function closeMenu() {}

  // ---------- pieces ----------
  function chip(k, txt) { return '<span class="chip ' + k + '">' + esc(txt) + '</span>'; }
  function badge(p) { return '<span class="badge" data-p="' + esc(p) + '">' + esc(p) + '</span>'; }
  function copyBtn(code, big) {
    var on = S.copied === code;
    return '<button class="copy' + (big ? ' big' : '') + (on ? ' on' : '') + '" data-copy="' + esc(code) + '">' + (on ? '✓ Copied' : 'Copy code') + '</button>';
  }
  function resTag(l) {
    var k = l.state, t = { won: '✓ won', lost: '✗ lost', live: 'live', pending: 'pending', void: 'void' }[k] || k;
    return '<span class="res ' + k + '">' + t + '</span>';
  }
  function legLine(l, i) {
    return '<div class="lg"><span class="i">' + (i + 1) + '</span><span style="min-width:0"><div class="m">' + esc(l.match) + '</div><div class="s">' + esc(l.sel) + ' <b>@ ' + (l.price || 0).toFixed(2) + '</b>' + (l.comp ? ' <span class="muted">· ' + esc(l.comp) + '</span>' : '') + '</div></span>' +
      '<span class="r">' + (l.state !== 'pending' ? resTag(l) : '<span class="muted mono">' + esc(l.ko || '') + '</span>') + (l.score ? '<span class="sc">' + esc(l.score) + (l.state === 'live' && l.hint ? ' · ' + esc(l.hint) : '') + '</span>' : '') + '</span></div>';
  }
  function tipCard(c, opts) {
    opts = opts || {};
    var title = TITLE[c.product] || c.product;
    if (c.product === 'Points sports' && c.sport) title = c.sport + ' slip';
    if (c.product === 'Live' && c.legs.length > 1) title = 'Live slip';
    var settled = c.n.won + c.n.lost + c.n.void, graded = c.n.won + c.n.lost;
    var stateNote = c.dead ? c.n.lost + ' of ' + c.total + ' legs lost' : c.allWon ? 'all ' + c.total + ' legs won' : graded ? c.n.won + ' of ' + c.total + ' legs won so far' : (c.n.live ? c.n.live + ' in play' : 'not started');
    var expanded = !!S.expanded[c.code] || c.legs.length <= 6;
    var legs = expanded ? c.legs : c.legs.slice(0, 6);
    var h = '<div class="tip ' + (c.dead ? 'dead' : c.allWon ? 'won' : '') + '" id="tip-' + esc(c.code) + '">' +
      '<div class="lab">' + esc(c.product) + (c.sport ? ' · ' + esc(c.sport) : '') + '<span class="when">' + (opts.when || (c.booked ? 'booked ' + esc(c.booked) : '')) + '</span></div>' +
      '<h2>' + esc(title) + '</h2><div class="sub">' + esc(SUB[c.product] || '') + '</div>' +
      '<div class="box"><div class="sum"><span><div class="k">Legs</div><div class="v">' + c.total + '</div></span>' +
      '<span class="right">' + chip(c.stateKey, c.stateTxt) + '<div class="odds">' + fmtOdds(c.odds) + '</div><div class="muted" style="font-size:11.5px">' + esc(stateNote) + '</div></span></div>' +
      '<div class="legs' + (expanded ? ' all' : '') + '">' + legs.map(legLine).join('') + '</div>' +
      (c.legs.length > 6 ? '<button class="showall" data-expand="' + esc(c.code) + '">' + (expanded ? 'Show fewer' : 'Show all ' + c.legs.length + ' legs') + '</button>' : '') + '</div>' +
      '<div class="coderow"><span class="codebar">' + esc(c.code) + '</span>' + copyBtn(c.code, false) + '</div>' +
      '<div class="links"><a href="' + esc(sporty(c.code)) + '" target="_blank" rel="noopener">Open on SportyBet &rarr;</a><a href="#slip/' + esc(c.code) + '">The numbers behind every leg</a>' +
      (opts.countdown != null ? '<span class="muted">' + opts.countdown + '</span>' : (c.window ? '<span class="muted">' + esc(c.window) + '</span>' : '')) + '</div>' +
      pickRow(c) + '</div>';
    return h;
  }
  function pickRow(c) {
    var targets = c.targets || [];
    if (!targets.length && !(c.nested || []).length) return '';
    var have = {}; (c.nested || []).forEach(function (n) { have[n.target] = n; });
    var h = '<div class="pick"><div class="k">Pick your odds <i>the shortest prices of this slip, still to kick off, as their own code</i></div>' +
      '<div class="chips">' + targets.map(function (t) {
        var n = have[t], busy = S.nestBusy[c.code + ':' + t];
        return '<button data-nest="' + esc(c.code) + '" data-target="' + t + '" class="' + (n ? 'have' : '') + (busy ? ' busy' : '') + '"' + (busy ? ' disabled' : '') + '>' + (busy ? '\u2026' : t + 'x') + '</button>';
      }).join('') + '</div>';
    if (S.nestMsg[c.code]) h += '<div class="msg">' + esc(S.nestMsg[c.code]) + '</div>';
    (c.nested || []).forEach(function (n) {
      h += '<div class="nest"><span class="t">' + n.target + 'x</span><span class="cb">' + esc(n.code) + '</span><span class="m">' + n.n + ' leg' + (n.n === 1 ? '' : 's') + ' \u00b7 ' + fmtOdds(n.odds) + 'x \u00b7 first kickoff ' + esc((n.legs && n.legs[0] && n.legs[0].ko) || '') + '</span>' +
        '<button class="copy' + (S.copied === n.code ? ' on' : '') + '" data-copy="' + esc(n.code) + '">' + (S.copied === n.code ? '\u2713 Copied' : 'Copy') + '</button><a class="btn line" style="min-height:40px;padding:8px 12px;font-size:13px" href="' + esc(sporty(n.code)) + '" target="_blank" rel="noopener">Open</a></div>';
    });
    return h + '</div>';
  }
  function nest(code, target) {
    var k = code + ':' + target;
    if (S.nestBusy[k]) return;
    S.nestBusy[k] = true; S.nestMsg[code] = ''; render();
    post('/api/nest', { code: code, target: target }).then(function (j) {
      delete S.nestBusy[k];
      if (j.error) { S.nestMsg[code] = j.error; render(); return; }
      var c = findCode(code);
      if (c) { c.nested = (c.nested || []).filter(function (n) { return n.target !== j.target; }).concat([j]).sort(function (a, b) { return a.target - b.target; }); }
      S.copied = j.code; try { navigator.clipboard.writeText(j.code); } catch (e) {}
      clearTimeout(doCopy.t); doCopy.t = setTimeout(function () { S.copied = null; render(); }, 1800);
      render();
    }).catch(function (e) { delete S.nestBusy[k]; S.nestMsg[code] = 'Failed: ' + e.message; render(); });
  }
  function gradeBox(small) {
    return '<form class="gradebox' + (small ? ' small' : '') + '" id="gradeform"><span><span class="t">Have a code? Check it.</span><br><span class="d">Any SportyBet booking code, graded leg by leg.</span></span>' +
      '<input id="gradein" placeholder="ABC123" maxlength="8" autocomplete="off" spellcheck="false"><button class="btn" type="submit"' + (S.gradeBusy ? ' disabled' : '') + '>' + (S.gradeBusy ? 'Grading…' : 'Check') + '</button></form>';
  }

  // ---------- Today: pick your odds ----------
  function rungCard(p, t) {
    var full = t === 'full';
    var r = full ? p : (p.ladder || {})[t];
    var title = (TITLE[p.product] || p.product);
    if (p.product === 'Points sports' && p.sport) title = p.sport + ' slip';
    if (!r) return '';
    var legs = full ? p.legs : r.legs.map(function (l) { return { match: l.match, sel: l.sel, price: l.price, ko: l.ko, state: l.state || 'pending', score: l.score || '', hint: l.hint || '', comp: l.comp || '' }; });
    var code = r.code, odds = r.odds;
    var n = { won: 0, lost: 0, live: 0, pending: 0, void: 0 };
    legs.forEach(function (l) { n[l.state] = (n[l.state] || 0) + 1; });
    var dead = n.lost > 0, allWon = legs.length && n.won + n.void === legs.length && n.won > 0;
    var status = dead ? 'lost' : allWon ? 'won' : n.live ? 'live' : 'pending';
    var statusTxt = dead ? n.lost + ' lost' : allWon ? 'all won' : (n.won ? n.won + ' won \u00b7 ' : '') + (n.live ? n.live + ' in play \u00b7 ' : '') + n.pending + ' to play';
    var h = '<div class="rung' + (dead ? ' dead' : allWon ? ' won' : '') + '"><div class="head"><span><span class="lab">' + esc(p.product) + (p.sport ? ' \u00b7 ' + esc(p.sport) : '') + (p.booked ? ' <span style="color:var(--tx3);letter-spacing:.02em;text-transform:none;font-weight:600">\u00b7 booked ' + esc(p.booked) + '</span>' : '') + '</span><h2>' + esc(title) + (full ? '' : ' \u00b7 ' + t + ' odds') + '</h2></span>' +
      '<span class="odds">' + fmtOdds(odds) + '<small>' + legs.length + ' leg' + (legs.length === 1 ? '' : 's') + '</small><div style="margin-top:4px">' + chip(status, statusTxt) + '</div></span></div>';
    var expanded = !!S.expanded[code] || legs.length <= 8;
    var shown = expanded ? legs : legs.slice(0, 8);
    h += '<div class="box"><div class="legs' + (expanded ? ' all' : '') + '">' + shown.map(legLine).join('') + '</div>' +
      (legs.length > 8 ? '<button class="showall" data-expand="' + esc(code) + '">' + (expanded ? 'Show fewer' : 'Show all ' + legs.length + ' legs') + '</button>' : '') + '</div>';
    h += '<div class="coderow"><span class="codebar">' + esc(code) + '</span>' + copyBtn(code, false) + '</div>';
    h += '<div class="links"><a href="' + esc(sporty(code)) + '" target="_blank" rel="noopener">Open on SportyBet &rarr;</a><a href="#slip/' + esc(p.code) + '">The numbers behind the legs</a>' +
      '<span class="muted">' + (full ? esc(p.window || '') : 'first kickoff ' + esc(r.first || '')) + '</span></div></div>';
    return h;
  }
  function renderToday() {
    var L = S.ladder;
    var b = S.banner;
    var h = '<div class="col"><div class="center"><span class="livepill"><i></i>' + (b && b.open ? b.open + ' open code' + (b.open === 1 ? '' : 's') : 'live updates') + (b && b.next_ko ? ' · next kickoff ' + esc(b.next_ko) : '') + '</span>' +
      '<h1 class="page">' + (S.day === 'yesterday' ? 'Yesterday’s' : 'Today’s') + ' <em>Codes</em></h1><p class="lead" style="margin-bottom:6px">Pick the odds you want. Betty builds the code from the day’s slip: the shortest prices first, up to your odds.</p></div>';
    h += '<div class="oddsbar"><div class="k">Pick your odds</div><div class="seg">' + [['3', '3x'], ['5', '5x'], ['10', '10x'], ['25', '25x'], ['50', '50x'], ['100', '100x'], ['full', 'Full slip']].map(function (o) {
      var avail = !L || L.products.some(function (p) { return o[0] === 'full' || (p.ladder || {})[o[0]]; });
      return '<button data-odds="' + o[0] + '" class="' + (S.odds === o[0] ? 'on' : '') + (avail ? '' : ' none') + '">' + o[1] + '</button>';
    }).join('') + '</div></div>';
    if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
    if (!L) return h + '<div class="muted center" style="margin:30px 0">Building today’s codes…</div></div>';
    var cards = L.products.map(function (p) { return rungCard(p, S.odds); }).filter(Boolean);
    if (!cards.length) {
      h += '<div class="empty"><div class="t">No ' + (S.odds === 'full' ? '' : S.odds + 'x ') + 'code ' + (S.day === 'yesterday' ? 'yesterday' : 'yet today') + '</div><div class="d">' +
        (L.products.length ? 'Today’s slips do not reach ' + S.odds + 'x with games still to kick off. Try a lower odds or the full slip.' : 'The morning run books at 09:05 WAT and the evening run at 16:35. Live codes fire at the whistle on the Live tab.') + '</div></div>';
    } else {
      h += '<div class="oddsnote">' + (S.odds === 'full' ? 'The whole slip each product booked today.' : 'One code per product at about ' + S.odds + 'x · the shortest prices of the day’s slip that are still to kick off.') + '</div>';
      h += cards.join('');
    }
    h += '<div class="daylink"><a href="#" data-day="today" class="' + (S.day === 'today' ? 'on' : '') + '">Today</a>·<a href="#" data-day="yesterday" class="' + (S.day === 'yesterday' ? 'on' : '') + '">Yesterday</a>·<a href="#results">Results</a></div>';
    h += gradeBox(true);
    return h + '</div>';
  }

  // ---------- Slip (the numbers) ----------
  function pills(arr) { return '<div class="pills">' + (arr || []).map(function (p) { return '<span class="pill ' + p[1] + '">' + esc(p[0]) + '</span>'; }).join('') + '</div>'; }
  function sheet(l) {
    var sh = l.sheet || {}; var h = '';
    if (sh.venue) {
      h += '<div class="blk"><div class="h">Venue form</div>' + sh.venue.map(function (v) {
        return '<div style="margin-bottom:12px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px"><span class="side">' + esc(v.side) + '</span><span class="sidelab">' + esc(v.label) + '</span></div>' +
          pills(v.pills) + '<div class="rec">' + esc(v.rec) + '</div><div class="rec">goal difference <strong>' + esc(v.margin) + '</strong></div></div>';
      }).join('') + '</div>';

          (o.strip || '').split('').map(function (r) { return '<span class="wdl ' + r + '">' + r + '</span>'; }).join('') + '</div></div>';
      }).join('') + '</div>';
    }
    if (sh.h2h && sh.h2h.length) h += '<div class="blk"><div class="h">Head to head · last ' + sh.h2h.length + ', home view</div>' + pills(sh.h2h) + '</div>';
    if (sh.shots && sh.shots.length) {

        return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--tx2)">' + esc(s[0]) + '</span><span class="mono" style="font-weight:700">' + esc(Number(s[1]).toFixed(1)) + '</span></div>' +
          '<div class="bar"><i class="' + (s[2] ? 'hot' : '') + '" style="width:' + Math.min(100, s[1] / 8 * 100) + '%"></i></div></div>';
      }).join('') + '</div>';
    }
    if (sh.half || sh.h2goals) {
      h += '<div class="blk half"><div class="h">At the whistle</div>';
      if (sh.half) h += '<div class="hk">' + sh.half.map(function (x) { return '<span><span class="k">' + esc(x.k) + '</span><span class="v">' + esc(x.v) + '</span></span>'; }).join('') + '</div>';
      if (sh.h2goals) {
        h += '<div class="h" style="margin-bottom:6px">Second-half goals, last 7</div>' + sh.h2goals.map(function (g) {
          return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap"><span style="font-size:12px;color:var(--tx2);min-width:92px">' + esc(g.side) + '</span><span style="display:flex;gap:3px">' +
            (g.nums || []).map(function (n) { return '<span class="num' + (n > 0 ? ' hot' : '') + '">' + n + '</span>'; }).join('') + '</span></div>';
        }).join('');
      }
      h += '</div>';
    }
    if (sh.af) {
      h += '<div class="blk"><div class="h">Venue history · the line</div>' + sh.af.map(function (a) {
        return '<div style="margin-bottom:10px"><div class="side" style="margin-bottom:5px">' + esc(a.side) + '</div>' + pills(a.pills) + '</div>';
      }).join('') + '<div class="hk" style="padding-top:8px;border-top:1px solid var(--line);margin-bottom:0"><span><span class="k">Line</span><span class="v">' + esc(sh.afLine || l.sel) + '</span></span>' +
        '<span><span class="k">Agreement</span><span class="v" style="color:var(--won)">' + esc(sh.afAgree || '-') + '</span></span></div></div>';
    }
    var flags = sh.flags || [];
    h += '<div class="blk flags"><div class="h">Flags · why the pick is shaped this way</div><div style="display:flex;flex-direction:column;gap:8px">' +
      (flags.length ? flags.map(function (f) { return '<div class="flag"><b>·</b><span>' + esc(f) + '</span></div>'; }).join('') : '<div class="flag"><b>·</b><span>No stat lines were logged with this leg.</span></div>') + '</div></div>';
    return '<div class="sheet"><div class="title"><b>The sheet</b><i>the numbers this pick was made from</i></div><div class="sgrid">' + h + '</div></div>';
  }
  function legRow(l, i) {
    var open = S.openLeg === i;
    var st = { pending: 'Pending', live: 'Live', void: 'Void', won: 'Won', lost: 'Lost' }[l.state] || l.state;
    return '<div class="leg ' + l.state + '"><button data-leg="' + i + '">' +
      '<span class="ko">' + esc(l.ko) + '</span>' +

    S.runMsg = 'Starting…'; render();
    req.then(function (j) { S.runMsg = j.error ? 'Refused: ' + j.error : 'Started. The log below follows the run.'; loadConsole(); render(); })
      .catch(function (e) { S.runMsg = 'Failed: ' + e.message; render(); });
  }


  // ---------- render ----------
  function renderNav() {
    var active = S.tab === 'Slip' ? 'Today' : S.tab;
    document.getElementById('topnav').innerHTML = TABS.map(function (t) { return '<button data-go="' + t[0] + '"' + (active === t[0] ? ' class="on"' : '') + '>' + t[2] + '</button>'; }).join('');
    document.getElementById('botnav').innerHTML = TABS.map(function (t) {
      return '<button data-go="' + t[0] + '"' + (active === t[0] ? ' class="on"' : '') + '><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + t[1] + '"></path></svg><span>' + t[2] + '</span></button>';
    }).join('');
    document.getElementById('app').setAttribute('data-t', S.theme);
    document.getElementById('themeLabel').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
    document.documentElement.style.background = S.theme === 'dark' ? '#171411' : '#f5ead8';
  }
  function render() {
    renderNav();
    var m = document.getElementById('main');
    var focus = document.activeElement && document.activeElement.id;
    var val = focus === 'gradein' ? document.getElementById('gradein').value : null;
    m.innerHTML = S.tab === 'Today' ? renderToday() : S.tab === 'Slip' ? renderSlip() : S.tab === 'Live' ? renderLive()
      : S.tab === 'Record' ? renderRecord() : S.tab === 'Rules' ? '<div class="col">' + renderRules() + '</div>' : S.tab === 'Console' ? renderConsole() : renderToday();
    if (val != null) { var gi = document.getElementById('gradein'); if (gi) { gi.value = val; gi.focus(); } }
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-copy],[data-open],[data-go],[data-day],[data-leg],[data-filter],[data-when],[data-res],[data-more],[data-pref],[data-tg],[data-pf],[data-older],[data-expand],[data-pane],[data-runp],[data-flag],[data-run],[data-yest],[data-watch],[data-nest],[data-odds]');
    if (!t) return;
    if (t.hasAttribute('data-copy')) { e.stopPropagation(); doCopy(t.getAttribute('data-copy')); return; }
    if (t.hasAttribute('data-nest')) { nest(t.getAttribute('data-nest'), +t.getAttribute('data-target')); return; }
    if (t.hasAttribute('data-open')) { var code = t.getAttribute('data-open'); if (findCode(code)) openSlip(code); else gradeCode(code); return; }
    if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
    if (t.hasAttribute('data-day')) { e.preventDefault(); S.day = t.getAttribute('data-day'); S.ladder = null; render(); loadLadder(true); loadCodes(); return; }
    if (t.hasAttribute('data-odds')) { S.odds = t.getAttribute('data-odds'); save('betty.odds', S.odds); render(); return; }
    if (t.hasAttribute('data-leg')) { var i = +t.getAttribute('data-leg'); S.openLeg = S.openLeg === i ? null : i; render(); return; }
    if (t.hasAttribute('data-filter')) { S.recFilter = t.getAttribute('data-filter'); S.recShow = 60; render(); return; }
    if (t.hasAttribute('data-when')) { S.recWhen = t.getAttribute('data-when'); S.recShow = 60; render(); return; }
    if (t.hasAttribute('data-res')) { S.recRes = t.getAttribute('data-res'); S.recShow = 60; render(); return; }
    if (t.hasAttribute('data-more')) { S.recShow += 60; render(); return; }
    if (t.hasAttribute('data-pref')) { var p = t.getAttribute('data-pref'); S.prefs[p] = !S.prefs[p]; save('betty.prefs', JSON.stringify(S.prefs)); render(); return; }
    if (t.hasAttribute('data-tg')) { S.tg = !S.tg; save('betty.tg', S.tg ? '1' : '0'); render(); return; }
    if (t.hasAttribute('data-pf')) { S.productFilter = t.getAttribute('data-pf'); render(); return; }
    if (t.hasAttribute('data-older')) { S.showOlder = !S.showOlder; render(); return; }
    if (t.hasAttribute('data-expand')) { var cc = t.getAttribute('data-expand'); S.expanded[cc] = !S.expanded[cc]; render(); return; }
    if (t.hasAttribute('data-pane')) { S.pane = t.getAttribute('data-pane'); setHash('#console/' + S.pane.toLowerCase()); render(); return; }
    if (t.hasAttribute('data-runp')) { S.runProduct = t.getAttribute('data-runp'); S.runMsg = ''; render(); return; }
    if (t.hasAttribute('data-flag')) { var k = t.getAttribute('data-flag'); S.runFlags[k] = !S.runFlags[k]; render(); return; }
    if (t.hasAttribute('data-run')) { runProduct(); return; }
    if (t.hasAttribute('data-yest')) { post('/api/yesterday', {}).then(function () { loadConsole(); }); S.console.yesterday = { state: 'running' }; render(); return; }
    if (t.hasAttribute('data-watch')) {
      var stop = t.getAttribute('data-watch') === 'stop';
      post('/api/live', stop ? { stop: true } : { until: 0, dry: false }).then(function (j) { S.runMsg = j.error ? 'Refused: ' + j.error : ''; setTimeout(function () { loadConsole(); loadLive(); }, 1500); });
      return;
    }
  });
  document.getElementById('theme').addEventListener('click', function () { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save('betty.theme', S.theme); render(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'gradeform') { e.preventDefault(); gradeCode(document.getElementById('gradein').value); }
    if (e.target.id === 'keyform') { e.preventDefault(); S.key = document.getElementById('keyin').value.trim(); save('betty.key', S.key); S.err = null; loadConsole(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.hasAttribute('data-opt')) S.runVals[e.target.getAttribute('data-opt')] = e.target.value;
  });

  // ---------- timers ----------
  setInterval(function () {
    S.tick++;
    if (S.tab === 'Live' && S.live) {
      document.querySelectorAll('[data-cd]').forEach(function (el) {
        var c = S.live.codes.filter(function (x) { return x.code === el.getAttribute('data-cd'); })[0]; if (!c) return;
        var left = c.closes_in - Math.floor((Date.now() - S.liveAt) / 1000);
        el.textContent = left > 0 ? mmss(left) : '00:00'; el.className = 'cd' + (left <= 0 ? ' over' : left < 180 ? ' low' : '');
      });
    }
  }, 1000);
  setInterval(function () { loadLive(); loadBanner().then(function () { if (S.tab === 'Today') render(); }); }, 30000);
  setInterval(function () { if (S.tab === 'Today') loadLadder(true); if (S.tab === 'Slip') loadCodes(S.day, true); if (S.tab === 'Record') loadLegs(); }, 30000);
  setInterval(function () { if (S.tab === 'Console') loadConsole(); }, 5000);

  render();
  loadLadder(true); loadCodes('today').then(loadBanner).then(function () { render(); route(); });
  loadLive();
  window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
