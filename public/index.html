<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANTBET — AI Accumulator & Rollover Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(15, 22, 36, 0.75);
      --bg-card-hover: rgba(22, 32, 52, 0.85);
      --border-glow: rgba(16, 185, 129, 0.25);
      --border-subtle: rgba(255, 255, 255, 0.08);
      
      --accent-emerald: #10b981;
      --accent-emerald-glow: rgba(16, 185, 129, 0.4);
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(7, 9, 14, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 24px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
      color: #000;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px var(--accent-emerald-glow);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 24px;
    }

    /* Mode Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 14px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      color: #000;
      background: linear-gradient(135deg, var(--accent-emerald), #34d399);
      border-color: var(--accent-emerald);
      box-shadow: 0 0 20px var(--accent-emerald-glow);
    }

    /* Summary Header Hero */
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-cyan), transparent);
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .stats-row {
      display: flex;
      gap: 24px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-emerald);
    }

    .stat-value.cyan {
      color: var(--accent-cyan);
    }

    .booking-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed var(--accent-emerald);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }

    .booking-label {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .booking-code {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    .action-btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent-emerald);
      color: #000;
    }

    .btn-primary:hover {
      background: #34d399;
      box-shadow: 0 0 15px var(--accent-emerald-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Grid of Predictions */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .legs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .leg-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .leg-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }

    .leg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sport-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .sport-tag.soccer {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .sport-tag.baseball {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .prob-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .match-name {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .league-name {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .pick-banner {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pick-label {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .pick-odds {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-emerald);
    }

    .stat-details {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Loading Spinner Overlay */
    .loading-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(16, 185, 129, 0.15);
      border-top-color: var(--accent-emerald);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--accent-emerald);
    }

    @media (max-width: 768px) {
      .hero-card {
        grid-template-columns: 1fr;
      }
      .booking-box {
        width: 100%;
      }
      .legs-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <div class="logo-badge">QUANTBET</div>
        <div class="brand-title">AI Sports Terminal</div>
      </div>
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>MODEL ENGINES ONLINE</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Tab Controls -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="loadMode('rollover', this)">🎯 10.0x Daily Rollover</button>
      <button class="tab-btn" onclick="loadMode('soccer', this)">⚽ Soccer Model Pro</button>
      <button class="tab-btn" onclick="loadMode('baseball', this)">⚾ Baseball Model Pro</button>
    </div>

    <!-- Hero Card -->
    <div class="hero-card" id="heroCard">
      <div class="hero-meta">
        <div class="hero-title" id="heroTitle">Daily ~10.0 Odds Rollover Slip</div>
        <div class="stats-row">
          <div class="stat-pill">
            <span class="stat-label">Combined Odds</span>
            <span class="stat-value" id="totalOdds">~10.78x</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Model Probability</span>
            <span class="stat-value cyan" id="modelProb">33.4%</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Verified Legs</span>
            <span class="stat-value" id="legsCount">11</span>
          </div>
        </div>
      </div>

      <div class="booking-box">
        <span class="booking-label">SPORTYBET SHARE CODE</span>
        <div class="booking-code" id="bookingCode">RWDPTK</div>
        <div class="action-btn-group">
          <button class="btn btn-primary" onclick="copyCode()">📋 Copy Code</button>
          <a class="btn btn-secondary" id="sportyLink" href="http://www.sportybet.com/ng/?shareCode=RWDPTK" target="_blank" rel="noopener">⚡ Bet Now</a>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingMsg">Executing Poisson & Pitcher Math Models...</div>
    </div>

    <!-- Grid Container -->
    <div id="contentContainer">
      <div class="section-header">
        <div class="section-title">Verified Accumulator Legs</div>
        <button class="btn btn-secondary" style="width: auto; padding: 6px 14px;" onclick="refreshCurrentMode()">🔄 Refresh Model</button>
      </div>

      <div class="legs-grid" id="legsGrid">
        <!-- Rendered via JavaScript -->
      </div>
    </div>
  </main>

  <script>
    let currentMode = 'rollover';

    const SAMPLE_DATA = {
      rollover: {
        title: "Daily ~10.0 Odds Rollover Slip",
        total_odds: 10.78,
        model_prob: 33.4,
        booking_code: "RWDPTK",
        share_url: "http://www.sportybet.com/ng/?shareCode=RWDPTK",
        legs: [
          { sport: "Baseball", match: "Atlanta Braves v San Diego Padres", label: "Over 5.5", odds: 1.34, prob: 95.0, league: "USA: MLB", stat_block: ["exp runs 10.66 (home 5.75 / away 4.90)", "pitchers: Martín Pérez (3.38 ERA) v Michael King (3.24 ERA)"] },
          { sport: "Soccer", match: "Preston Lions v Bentleigh Greens", label: "FT Home DNB", odds: 1.11, prob: 94.0, league: "AUSTRALIA: NPL Victoria", stat_block: ["exp 2.80 (home 2.10 / away 0.70)", "home@home scored [3, 2, 4, 1]"] },
          { sport: "Soccer", match: "Sarmiento Junin v Argentinos Jrs", label: "2H Under 2.5", odds: 1.06, prob: 94.0, league: "ARGENTINA: Liga Profesional", stat_block: ["exp 2.10 (home 0.91 / away 1.19)", "2H: home 0.43 / away 0.43"] },
          { sport: "Baseball", match: "Cleveland Guardians v Minnesota Twins", label: "Over 5.5", odds: 1.38, prob: 93.0, league: "USA: MLB", stat_block: ["exp runs 9.82 (home 4.87 / away 4.95)", "pitchers: Slade Cecconi (4.6 ERA) v Bailey Ober (4.56 ERA)"] },
          { sport: "Soccer", match: "Racing Club v Gimnasia L.P.", label: "2H Under 2.5", odds: 1.09, prob: 92.0, league: "ARGENTINA: Liga Profesional", stat_block: ["exp 2.15 (home 1.20 / away 0.95)", "2H: home 0.50 / away 0.40"] },
          { sport: "Baseball", match: "Toronto Blue Jays v Tampa Bay Rays", label: "Under 10.5", odds: 1.44, prob: 86.0, league: "USA: MLB", stat_block: ["exp runs 7.52 (home 3.24 / away 4.28)", "pitchers: Braydon Fisher (3.73 ERA) v Griffin Jax (3.89 ERA)"] }
        ]
      }
    };

    function renderData(data) {
      document.getElementById('heroTitle').innerText = data.title || 'Model Slip';
      document.getElementById('totalOdds').innerText = `~${data.total_odds}x`;
      document.getElementById('modelProb').innerText = `${data.model_prob}%`;
      document.getElementById('legsCount').innerText = data.legs ? data.legs.length : 0;
      
      const code = data.booking_code || 'N/A';
      document.getElementById('bookingCode').innerText = code;
      
      const sportyUrl = data.share_url || (code !== 'N/A' ? `http://www.sportybet.com/ng/?shareCode=${code}` : '#');
      document.getElementById('sportyLink').href = sportyUrl;

      const grid = document.getElementById('legsGrid');
      grid.innerHTML = '';

      if (data.legs && data.legs.length > 0) {
        data.legs.forEach(leg => {
          const card = document.createElement('div');
          card.className = 'leg-card';

          const sportClass = (leg.sport || '').toLowerCase() === 'baseball' ? 'baseball' : 'soccer';
          const icon = sportClass === 'baseball' ? '⚾' : '⚽';

          const statsHtml = (leg.stat_block || []).map(s => `<div>${s}</div>`).join('');

          card.innerHTML = `
            <div class="leg-header">
              <span class="sport-tag ${sportClass}">${icon} ${leg.sport}</span>
              <span class="prob-badge">${leg.prob}% Prob</span>
            </div>
            <div>
              <div class="match-name">${leg.match}</div>
              <div class="league-name">${leg.league || ''}</div>
            </div>
            <div class="pick-banner">
              <span class="pick-label">${leg.label}</span>
              <span class="pick-odds">@${leg.odds.toFixed(2)}</span>
            </div>
            <div class="stat-details">
              ${statsHtml}
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    async function loadMode(mode, btn) {
      currentMode = mode;
      
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      document.getElementById('contentContainer').style.display = 'none';
      document.getElementById('loadingOverlay').style.display = 'flex';

      try {
        const res = await fetch(`/api/${mode}`);
        if (!res.ok) throw new Error('API request failed');
        const data = await res.json();
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('contentContainer').style.display = 'block';
        renderData(data);
      } catch (err) {
        console.warn('Falling back to local cache view:', err);
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('contentContainer').style.display = 'block';
        if (SAMPLE_DATA[mode]) {
          renderData(SAMPLE_DATA[mode]);
        } else {
          renderData(SAMPLE_DATA['rollover']);
        }
      }
    }

    function refreshCurrentMode() {
      loadMode(currentMode);
    }

    function copyCode() {
      const code = document.getElementById('bookingCode').innerText;
      if (code && code !== 'N/A') {
        navigator.clipboard.writeText(code);
        const btn = event.target;
        const orig = btn.innerText;
        btn.innerText = '✅ Copied!';
        setTimeout(() => btn.innerText = orig, 2000);
      }
    }

    // Initial render
    renderData(SAMPLE_DATA.rollover);
  </script>
</body>
</html>
